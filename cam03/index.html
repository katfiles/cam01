<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAM_03 // EM DIRETO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --hud: #cfe9df;
    --dim: #6f8f84;
    --red: #e3121c;
    --bg: #000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    color: var(--hud);
    font-family: "Share Tech Mono", ui-monospace, "Courier New", monospace;
    letter-spacing: .04em;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---------- monitor layout ---------- */
  .monitor {
    position: relative;
    height: 100dvh;
    display: grid;
    grid-template-rows: 1fr;
  }
  .live { display: flex; align-items: center; gap: 8px; color: var(--red); }
  .dot {
    width: .7em; height: .7em; border-radius: 50%;
    background: var(--red); box-shadow: 0 0 8px var(--red);
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .screen {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    min-height: 0;
  }
  .frame { position: relative; opacity: 0; }
  .on .frame { opacity: 1; animation: poweron .9s ease-out both, jitter 7s infinite 2s; }
  .feed {
    display: block;
    width: 100%; height: 100%;
    opacity: 0;
    filter: brightness(1.25) contrast(1.1);
    transition: opacity .25s;
  }
  .on .feed { opacity: 1; }
  /* live date/time burned into the feed, under REC */
  .stamp {
    position: absolute;
    font-family: "Share Tech Mono", ui-monospace, "Courier New", monospace;
    color: #ecece9;
    letter-spacing: 0;
    line-height: 1;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 .35em rgba(0,0,0,.75), 0 0 .12em rgba(0,0,0,.55);   /* soft shadow, no outline */
  }
  .hud {
    position: absolute;
    font-family: "Share Tech Mono", ui-monospace, "Courier New", monospace;
    color: #e2e1dc;
    line-height: 1;
    white-space: nowrap;
    letter-spacing: .02em;
  }
  .hud .live { display: inline-flex; align-items: center; gap: .35em; color: var(--red); text-shadow: 0 0 .25em rgba(227,18,28,.45); }
  .stamp.outlined {
    color: #c9cac8;
    text-shadow: -.05em -.05em 0 #111, .05em -.05em 0 #111, -.05em .05em 0 #111, .05em .05em 0 #111, 0 0 .12em #000;
  }
  @keyframes poweron {
    0%   { transform: scaleY(.004) scaleX(.6); filter: brightness(4); }
    35%  { transform: scaleY(.004) scaleX(1); filter: brightness(3); }
    60%  { transform: scaleY(1.04); filter: brightness(1.6) contrast(1.3); }
    100% { transform: none; filter: none; }
  }
  /* rare signal glitch */
  @keyframes jitter {
    0%, 93%, 100% { transform: none; filter: none; }
    94% { transform: translateX(-3px) skewX(-1deg); filter: hue-rotate(-12deg) brightness(1.15); }
    95% { transform: translateX(4px); }
    96% { transform: translateX(-1px); filter: none; }
  }

  /* CRT overlays */
  .scan, .noise, .vignette { position: absolute; inset: 0; pointer-events: none; }
  .scan {
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.22) 3px);
    mix-blend-mode: multiply;
  }
  .scan::after {           /* rolling refresh band */
    content: ""; position: absolute; left: 0; right: 0; height: 18%;
    background: linear-gradient(to bottom, transparent, rgba(180,255,220,.06), transparent);
    animation: roll 6s linear infinite;
  }
  @keyframes roll { from { top: -20%; } to { top: 110%; } }
  .noise {
    opacity: .07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain .4s steps(3) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0,0); } 33% { transform: translate(-6px,4px); } 66% { transform: translate(5px,-5px); }
  }
  .vignette { background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%); }

  /* ---------- boot sequence ---------- */
  .boot {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 8vw;
    font-size: clamp(12px, 3.6vw, 16px);
    line-height: 1.9;
    color: var(--hud);
    background: #000;
    z-index: 5;
    transition: opacity .3s;
  }
  .boot .ok { color: #7dffb7; }
  .boot .warn { color: var(--red); }
  .boot .cursor::after { content: "█"; animation: blink .8s steps(1) infinite; margin-left: 2px; }
  .on .boot { opacity: 0; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    .on .frame, .scan::after, .noise, .dot { animation: none !important; }
  }
</style>
</head>
<body>
<div class="monitor" id="monitor">

  <div class="screen">
    <div class="frame" id="frame">
      <img class="feed" id="feed" src="feed.jpg?v=2" alt="Imagem de câmara de vigilância: uma figura em imagem térmica na sala 4.15. Não há cantos cegos nesta sala.">
      <span class="stamp" data-x="115" data-y="228" data-w="344"></span>
      <span class="stamp" data-x="115" data-y="1412" data-w="344"></span>
      <span class="hud" data-left="110" data-y="168" data-cap="30"><span class="live"><span class="dot"></span>EM DIRETO</span></span>
      <span class="hud" data-left="110" data-y="1357" data-cap="30"><span class="live"><span class="dot"></span>EM DIRETO</span></span>
      <span class="hud" data-right="1632" data-y="1235" data-cap="28">SIG ▮▮▮▮▯ // REC 1080P</span>
    </div>
    <div class="scan"></div>
    <div class="noise"></div>
    <div class="vignette"></div>
    <div class="boot" id="boot" aria-live="polite"></div>
  </div>
</div>

<script>
  const IMG_W = 1684, IMG_H = 2528;
  const frame = document.getElementById('frame');
  const stamps = [...document.querySelectorAll('.stamp')];
  function stampText(now) {
    const p = Object.fromEntries(new Intl.DateTimeFormat('pt-PT', {
      timeZone: 'Europe/Lisbon', day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
    }).formatToParts(now).map(x => [x.type, x.value]));
    return `${p.day}-${p.month}-${p.year} ${p.hour}:${p.minute}:${p.second}`;
  }
  function layout() {
    const box = frame.parentElement.getBoundingClientRect();
    const w = Math.min(box.width, box.height * IMG_W / IMG_H);
    frame.style.width = w + 'px';
    frame.style.height = (w * IMG_H / IMG_W) + 'px';
    const k = w / IMG_W;
    layoutHud(k);
    stamps.forEach(el => {
      el.style.left = (el.dataset.x * k) + 'px';
      el.style.top = (el.dataset.y * k) + 'px';
      el.style.fontSize = '100px';
      const natural = el.getBoundingClientRect().width || 1;
      const fs = 100 * (el.dataset.w * k) / natural;
      el.style.fontSize = fs + 'px';
      el.style.marginTop = (-0.18 * fs) + 'px';   // align cap tops with the old label
    });
  }
  const huds = [...document.querySelectorAll('.hud')];
  function layoutHud(k) {
    huds.forEach(el => {
      const fs = el.dataset.cap * k / 0.7;           // cap height ≈ 0.7em
      el.style.fontSize = fs + 'px';
      if (el.dataset.right) el.style.right = ((IMG_W - el.dataset.right) * k) + 'px';
      else el.style.left = (el.dataset.left * k) + 'px';
      el.style.top = (el.dataset.y * k - 0.05 * fs) + 'px';
    });
  }
  const tickAll = () => { const t = stampText(new Date()); stamps.forEach(el => el.textContent = t); };
  tickAll(); setInterval(tickAll, 1000);
  layout();
  addEventListener('resize', layout);
  document.fonts && document.fonts.ready.then(layout);

  // boot sequence, then power on the feed
  const lines = [
    ['A ESTABELECER LIGAÇÃO…', ''],
    ['CAM_03 // FBAUL // SALA 4.15', ''],
    ['SENSOR TÉRMICO ............ ', 'OK', 'ok'],
    ['CORPO DETETADO ............ ', '36.5°C', 'ok'],
    ['IDENTIDADE ................ ', 'NÃO ENCONTRADA', 'warn'],
  ];
  const boot = document.getElementById('boot');
  const feed = document.getElementById('feed');
  const monitor = document.getElementById('monitor');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const step = reduce ? 120 : 430;

  let i = 0;
  function nextLine() {
    if (i > 0) boot.lastChild.classList.remove('cursor');
    if (i < lines.length) {
      const [txt, val, cls] = lines[i++];
      const div = document.createElement('div');
      div.className = 'cursor';
      div.textContent = txt;
      if (val) { const s = document.createElement('span'); s.className = cls; s.textContent = val; div.appendChild(s); }
      boot.appendChild(div);
      setTimeout(nextLine, step);
    } else {
      const go = () => setTimeout(() => monitor.classList.add('on'), reduce ? 0 : 350);
      if (feed.complete) go(); else feed.addEventListener('load', go, { once: true });
    }
  }
  nextLine();
</script>
</body>
</html>
